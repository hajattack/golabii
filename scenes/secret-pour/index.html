<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golabii — the secret pour</title>
<style>
  html, body { margin: 0; height: 100%; background: #050b08; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: pan-y; }   /* phones can still scroll the page past the scene */
  #veil { position: fixed; inset: 0; background: #050b08; display: grid; place-items: center; transition: opacity 0.9s ease;
    color: rgba(255,255,255,.55); font: 500 11px/1 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; letter-spacing: .2em; text-transform: uppercase; }
  #veil.off { opacity: 0; pointer-events: none; }
  #replay { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom));
    font: 500 10px/1 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(255,250,240,.62); background: rgba(14,12,8,.26); border: 1px solid rgba(255,245,225,.16); border-radius: 999px;
    padding: 8px 13px; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 1s ease, color .2s, background .2s; }
  #replay.on { opacity: 1; pointer-events: auto; }
  #replay:hover, #replay:focus-visible { color: #fff; background: rgba(14,12,8,.5); outline: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="replay" type="button" aria-label="Play the pour again">Replay</button>
<div id="veil">Golabii</div>
<script type="module">
import * as THREE from './three.module.min.js';
import GLYPHS from './glyphs.js';

const canvas = document.getElementById('c');
const veil = document.getElementById('veil');
const DEBUG = location.hash.slice(1);

/* ---------- seeded random ---------- */
let seed = 91173;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const pick = a => a[Math.floor(rnd() * a.length)];
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

/* =====================================================================
   RENDERER
   ===================================================================== */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
} catch (e) { veil.textContent = 'This piece needs WebGL2'; throw e; }
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // the glass pass tone-maps and encodes
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.autoClear = false;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const CAM_Z = 3.2, FOV = 34;
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.4, 14);
const scene = new THREE.Scene();

/* =====================================================================
   TEXTURES — photo-scanned branch cards (ez-tree, MIT), with a relief map derived from them
   ===================================================================== */
function loadImage(url) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('image ' + url)); im.src = url; });
}
function branchTextures(img, hueShift) {
  const S = img.width, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0);
  const id = x.getImageData(0, 0, S, S), d = id.data, lum = new Float32Array(S * S);
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    let r = d[i], g = d[i + 1], b = d[i + 2];
    if (hueShift) {                       // autumn aspen -> spring green, keeping its shading
      const l = 0.3 * r + 0.6 * g + 0.1 * b, wood = r > g * 1.15 && l < 110 ? 1 : 0;
      if (!wood) { const k = l / 255; r = 255 * k * (0.50 + 0.22 * k); g = 255 * k * (0.98 + 0.05 * k); b = 255 * k * (0.26 + 0.10 * k); r = Math.min(255, r * 1.02); g = Math.min(255, g * 1.0); }
      d[i] = r; d[i + 1] = g; d[i + 2] = b;
    }
    lum[p] = (0.3 * r + 0.6 * g + 0.1 * b) / 255;
  }
  x.putImageData(id, 0, 0);
  const map = new THREE.CanvasTexture(c); map.colorSpace = THREE.SRGBColorSpace; map.anisotropy = Math.min(8, maxAniso);
  // relief from luminance: veins and leaf edges catch the light
  const n = document.createElement('canvas'); n.width = n.height = S;
  const nx = n.getContext('2d'), nd = nx.createImageData(S, S), o = nd.data;
  for (let yy = 0; yy < S; yy++) for (let xx = 0; xx < S; xx++) {
    const p = yy * S + xx, xl = lum[yy * S + Math.max(0, xx - 1)], xr = lum[yy * S + Math.min(S - 1, xx + 1)];
    const yu = lum[Math.max(0, yy - 1) * S + xx], yd = lum[Math.min(S - 1, yy + 1) * S + xx];
    let dx = (xl - xr) * 2.2, dy = (yd - yu) * 2.2; const il = 1 / Math.hypot(dx, dy, 1);
    o[p * 4] = (dx * il * 0.5 + 0.5) * 255; o[p * 4 + 1] = (dy * il * 0.5 + 0.5) * 255; o[p * 4 + 2] = (il * 0.5 + 0.5) * 255; o[p * 4 + 3] = 255;
  }
  nx.putImageData(nd, 0, 0);
  const normalMap = new THREE.CanvasTexture(n); normalMap.anisotropy = Math.min(4, maxAniso);
  return { map, normalMap };
}

/* =====================================================================
   MATERIALS — wind in the vertex stage, lamp light glowing through leaves and petals
   ===================================================================== */
const shared = { uTime: { value: 0 }, uLampView: { value: new THREE.Vector3() }, uLampCol: { value: new THREE.Color() } };
function windy(sh) {
  sh.uniforms.uTime = shared.uTime;
  sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
    { float wh = clamp(position.y, 0.0, 1.0); wh = wh * wh * (1.4 - 0.4 * wh);
      vec3 wo = modelMatrix[3].xyz; float ph = wo.x * 3.1 + wo.y * 2.3 + wo.z * 5.3;
      float gust = sin(uTime * 0.23 + wo.x * 0.7) * 0.5 + 0.5;                       // one slow breath across the whole case
      transformed.x += (gust * 0.050 + sin(uTime * 0.8 + ph) * 0.016 + sin(uTime * 0.33 + ph * 1.7) * 0.022) * wh;
      transformed.z += cos(uTime * 0.5 + ph) * 0.012 * wh; }`);
}
function shadowMat(map) {                      // depth material that sways with the plant, so shadows on the wall move too
  const m = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: map || null, alphaTest: map ? 0.42 : 0, side: THREE.DoubleSide });
  m.onBeforeCompile = windy; return m;
}
function living(mat, tint) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = shared.uTime; sh.uniforms.uLampView = shared.uLampView; sh.uniforms.uLampCol = shared.uLampCol;
    sh.uniforms.uTransTint = { value: tint };
    windy(sh);
    sh.fragmentShader = 'uniform vec3 uLampView; uniform vec3 uLampCol; uniform vec3 uTransTint;\n' + sh.fragmentShader.replace('#include <opaque_fragment>', `
      { vec3 Lv = uLampView + vViewPosition; float dl = dot(Lv, Lv); vec3 Ld = Lv * inversesqrt(dl);
        float back = max(dot(-normal, Ld), 0.0);
        outgoingLight += diffuseColor.rgb * uTransTint * uLampCol * (back / (1.0 + dl * 1.2)) * 0.8; }
      #include <opaque_fragment>`);
  };
  return mat;
}
const floraMat = living(new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.62, metalness: 0, sheen: 0.22, sheenRoughness: 0.6,
  sheenColor: new THREE.Color(0xffffff), side: THREE.DoubleSide }), new THREE.Color(0.9, 0.82, 0.8));
let cardMats = {}, cardDepth = {};
const floraDepth = shadowMat(null);

/* =====================================================================
   GEOMETRY HELPERS
   ===================================================================== */
const C = hex => new THREE.Color(hex);
function mergeGeos(list) {
  let nv = 0, ni = 0;
  for (const g of list) { nv += g.attributes.position.count; ni += g.index ? g.index.count : g.attributes.position.count; }
  const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3), col = new Float32Array(nv * 3), idx = new Uint32Array(ni);
  let vo = 0, io = 0;
  for (const g of list) {
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, vo * 3); nor.set(g.attributes.normal.array, vo * 3);
    if (g.attributes.color) col.set(g.attributes.color.array, vo * 3); else col.fill(1, vo * 3, (vo + n) * 3);
    if (g.index) { for (let i = 0; i < g.index.count; i++) idx[io++] = g.index.array[i] + vo; } else { for (let i = 0; i < n; i++) idx[io++] = vo + i; }
    vo += n;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3)); out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3)); out.setIndex(new THREE.BufferAttribute(idx, 1));
  return out;
}
function paint(g, fn) {                     // per-vertex colour from a callback (x, y, z, i) -> THREE.Color
  const p = g.attributes.position, c = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) { const k = fn(p.getX(i), p.getY(i), p.getZ(i), i); c[i * 3] = k.r; c[i * 3 + 1] = k.g; c[i * 3 + 2] = k.b; }
  g.setAttribute('color', new THREE.BufferAttribute(c, 3)); return g;
}
const tmpC = new THREE.Color();
const mixC = (a, b, t) => tmpC.copy(a).lerp(b, Math.min(1, Math.max(0, t)));
/* tapered tube along a list of points */
function tube(pts, r0, r1, c0, c1, radial = 6) {
  const curve = new THREE.CatmullRomCurve3(pts), segs = Math.max(6, pts.length * 4);
  const fr = curve.computeFrenetFrames(segs, false), pos = [], nor = [], col = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, p = curve.getPointAt(t), r = lerp(r0, r1, t), cc = mixC(c0, c1, t).clone();
    for (let j = 0; j < radial; j++) {
      const a = j / radial * Math.PI * 2, nx = Math.cos(a), ny = Math.sin(a);
      const n = new THREE.Vector3().addScaledVector(fr.normals[i], nx).addScaledVector(fr.binormals[i], ny);
      pos.push(p.x + n.x * r, p.y + n.y * r, p.z + n.z * r); nor.push(n.x, n.y, n.z);
      const sh = 0.8 + 0.2 * nx; col.push(cc.r * sh, cc.g * sh, cc.b * sh);
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) {
    const a = i * radial + j, b = i * radial + (j + 1) % radial, c = a + radial, d = b + radial; idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.setIndex(idx);
  g.userData.curve = curve; return g;
}
/* a stem that wanders upward from the origin to (roughly) y = len */
function stemPoints(len, bendX, bendZ, wob, n = 9, x0 = 0, y0 = 0, z0 = 0, ang = 0) {
  const pts = []; let x = x0, y = y0, z = z0; const ph = rnd() * 6.28;
  for (let i = 0; i <= n; i++) {
    const t = i / n; pts.push(new THREE.Vector3(x, y, z));
    const a = ang + bendX * t + wob * Math.sin(t * 5 + ph);
    x += Math.sin(a) * len / n; y += Math.cos(a) * len / n; z += (bendZ * t + wob * 0.6 * Math.cos(t * 4 + ph)) * len / n;
  }
  return pts;
}

/* ---------- a single soft leaflet (for rose leaves and small bracts) ---------- */
function leaflet(len, wid, c0, c1, fold = 0.35) {
  const g = new THREE.PlaneGeometry(1, 1, 4, 6), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i) * 2, v = p.getY(i) + 0.5;
    const w = wid * 0.5 * Math.pow(Math.sin(Math.PI * Math.pow(v, 0.75)), 0.8);
    p.setXYZ(i, u * w, v * len, Math.abs(u) * w * fold - len * 0.18 * v * v);
  }
  g.computeVertexNormals();
  return paint(g, (x, y) => mixC(c0, c1, y / len + Math.abs(x) / wid * 0.3).clone());
}
function place(g, pos, rx, ry, rz, s = 1) {   // orient a +Y part and move it into the plant
  const m = new THREE.Matrix4().compose(pos, new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz, 'ZYX')), new THREE.Vector3(s, s, s));
  g.applyMatrix4(m); return g;
}

/* ---------- rose: thirty-odd cupped petals on a golden-angle spiral ---------- */
const ROSE_PALS = [
  [C(0x3a0614), C(0x96102e), C(0xd24a66)],     // wine
  [C(0x48081a), C(0xb81436), C(0xe65a72)],     // crimson
  [C(0x4a0c2e), C(0xac1c60), C(0xdc6690)],     // deep magenta rose
  [C(0x560c16), C(0xc21e32), C(0xee6a74)],     // garnet
  [C(0x40142c), C(0x962856), C(0xcc6c8c)],     // mulberry
];
function roseHead(R, pal) {
  // Petals are wrapped around the flower's axis (not flat cards): the heart is a tight scroll,
  // the middle rows form the cup, and the outer rows open wide with their rims rolled back.
  const parts = [], N = 24;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1), tt = Math.pow(t, 1.35), a0 = i * 2.5133 + rr(-0.22, 0.22);            // 144 degrees apart: five-fold whorls
    const s = R * lerp(1.0, 1.3, t) * rr(0.94, 1.06);
    const r0 = R * lerp(0.015, 0.16, t), rTop = R * lerp(0.07, 0.80, tt);
    const wrap = lerp(2.1, 0.80, Math.pow(t, 0.65)) * rr(0.92, 1.08);
    const hk = lerp(1.0, 0.74, Math.pow(t, 1.5)), reflexK = R * lerp(0.01, 0.24, tt) * rr(0.7, 1.25), lift = R * 0.20 * (1 - t);
    const g = new THREE.PlaneGeometry(1, 1, 9, 8), p = g.attributes.position, cols = new Float32Array(p.count * 3);
    for (let k = 0; k < p.count; k++) {
      const u = p.getX(k) * 2, v = p.getY(k) + 0.5;
      const wp = 0.22 + 0.78 * Math.pow(Math.sin(Math.PI * 0.5 * Math.min(1, v * 1.4)), 0.85);
      const phi = u * wrap * wp;
      const yv = v - 0.15 * u * u * u * u * v * v;                                              // rounded shoulders
      const rfx = Math.pow(sstep(0.58, 1, v), 1.5) * (0.55 + 0.45 * u * u) * reflexK;                           // rim rolls outward and down
      const rad = r0 + (rTop - r0) * Math.pow(Math.sin(v * Math.PI * 0.5), 0.9) + rfx;        // walls rise like a cup, then the rim turns out
      p.setXYZ(k, Math.sin(a0 + phi) * rad, s * yv * hk - rfx * 0.30 + lift, Math.cos(a0 + phi) * rad);
      const c = mixC(pal[0], pal[1], sstep(0.05, 0.75, v)).clone().lerp(pal[2], sstep(0.74, 1.0, v) * (0.22 + 0.55 * t))
        .multiplyScalar(lerp(0.58, 1.0, sstep(0.0, 0.7, v)) * lerp(0.76, 1.0, t));               // dark down in the cup, light on the rims
      cols[k * 3] = c.r; cols[k * 3 + 1] = c.g; cols[k * 3 + 2] = c.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(cols, 3)); g.computeVertexNormals(); parts.push(g);
  }
  const sg0 = C(0x1f4a1c), sg1 = C(0x4f8a35);
  for (let i = 0; i < 5; i++) parts.push(place(leaflet(R * 1.0, R * 0.28, sg0, sg1, 0.2), new THREE.Vector3(0, R * 0.04, 0), 2.0, i / 5 * 6.283 + 0.3, 0));
  const hip = new THREE.SphereGeometry(R * 0.2, 8, 6); hip.scale(1, 1.25, 1); hip.translate(0, -R * 0.08, 0);
  parts.push(paint(hip, () => C(0x3d6e2c)));
  return mergeGeos(parts);
}
function roseBud(R, pal) {
  const parts = [];
  for (let i = 0; i < 5; i++) {
    const g = new THREE.PlaneGeometry(1, 1, 4, 5), p = g.attributes.position, a = i * 2.4;
    for (let k = 0; k < p.count; k++) {
      const u = p.getX(k) * 2, v = p.getY(k) + 0.5, w = R * 0.42 * Math.sin(Math.PI * Math.pow(v, 0.7)) * 0.5 + R * 0.02;
      const x = u * w, z = R * 0.2 * Math.sin(Math.PI * v) * (1 - v * 0.6) - u * u * w * 1.3 + R * 0.02;
      p.setXYZ(k, x * Math.cos(a) + z * Math.sin(a), v * R * 1.5, -x * Math.sin(a) + z * Math.cos(a));
    }
    g.computeVertexNormals(); parts.push(paint(g, (x, y) => mixC(pal[0], pal[1], y / (R * 1.5)).clone()));
  }
  const sg0 = C(0x1f4a1c), sg1 = C(0x5a9438);
  for (let i = 0; i < 5; i++) parts.push(place(leaflet(R * 1.1, R * 0.26, sg0, sg1, 0.3), new THREE.Vector3(0, 0, 0), 0.38, i / 5 * 6.283, 0));
  return mergeGeos(parts);
}

/* ---------- chicory: strap petals with five-toothed tips ---------- */
const CHIC = {
  blue: [[C(0xc9d6ff), C(0x6e8df2), C(0x8fa8ff), C(0x26348f)], [C(0xd4dcff), C(0x7f97f5), C(0xa3b6ff), C(0x2c3a9c)], [C(0xcdd0ff), C(0x7a7cf0), C(0x9aa0ff), C(0x2e2a8c)]],
  pink: [[C(0xffe1f0), C(0xea6aa9), C(0xff9ecb), C(0x8a1f58)], [C(0xffe8f2), C(0xf288b8), C(0xffb6d6), C(0x9a2c66)], [C(0xffdce8), C(0xe85c93), C(0xff93b8), C(0x8c1f4c)]],
};
function chicoryHead(R, pal) {
  const parts = [], n = 16 + Math.floor(rnd() * 4), off = rnd() * 6.283;
  for (let layer = 0; layer < 2; layer++) for (let i = 0; i < n; i++) {
    const a = off + (i + layer * 0.5) / n * 6.283 + rr(-0.06, 0.06), len = R * rr(0.86, 1) * (layer ? 0.9 : 1);
    const droop = rr(0.10, 0.34) + layer * 0.18, g = new THREE.PlaneGeometry(1, 1, 6, 5), p = g.attributes.position, cols = new Float32Array(p.count * 3);
    for (let k = 0; k < p.count; k++) {
      const uj = Math.round((p.getX(k) + 0.5) * 6), u = p.getX(k) * 2, v = p.getY(k) + 0.5;
      const w = R * (0.035 + 0.085 * Math.pow(v, 0.8));
      let rad = R * 0.07 + v * len; if (v > 0.99) rad += (uj % 2 ? R * 0.055 : 0) - R * 0.02;
      const x = u * w, y = R * 0.03 - droop * R * v * v + R * 0.02 * (1 - u * u) + layer * R * 0.012;
      p.setXYZ(k, x * Math.cos(a) + rad * Math.sin(a), y, -x * Math.sin(a) + rad * Math.cos(a));
      const c = mixC(pal[0], pal[1], sstep(0.0, 0.55, v)).clone().lerp(pal[2], sstep(0.6, 1, v) * 0.6).multiplyScalar(0.93 + 0.07 * (1 - u * u));
      cols[k * 3] = c.r; cols[k * 3 + 1] = c.g; cols[k * 3 + 2] = c.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(cols, 3)); g.computeVertexNormals(); parts.push(g);
  }
  for (let i = 0; i < 11; i++) {                 // stamens
    const a = rnd() * 6.283, l = R * rr(0.16, 0.3), lean = rr(0.15, 0.6);
    const g = new THREE.CylinderGeometry(R * 0.012, R * 0.02, l, 4, 1); g.translate(0, l / 2, 0);
    paint(g, (x, y) => mixC(pal[3], pal[0], sstep(0.75, 1, y / l)).clone());
    parts.push(place(g, new THREE.Vector3(Math.sin(a) * R * 0.03, R * 0.03, Math.cos(a) * R * 0.03), lean, a, 0));
  }
  const cup = new THREE.ConeGeometry(R * 0.16, R * 0.34, 7, 1, true); cup.rotateX(Math.PI); cup.translate(0, -R * 0.13, 0);
  parts.push(paint(cup, () => C(0x4a7a3a)));
  return mergeGeos(parts);
}

/* ---------- saffron crocus: six lilac tepals in a goblet, three red stigmas, three yellow stamens ---------- */
const CROC = [[C(0xf3ecff), C(0xae86f2), C(0x7440cc)], [C(0xf6eeff), C(0x9c6ee8), C(0x6032b8)], [C(0xefe6ff), C(0xbc98f6), C(0x8050d8)]];
function crocusHead(L, pal, open) {
  const parts = [];
  for (let i = 0; i < 6; i++) {
    const inner = i % 2, a0 = i / 6 * 6.283 + rr(-0.08, 0.08), len = L * (inner ? 0.9 : 1) * rr(0.94, 1.05), op = open * (inner ? 0.8 : 1) * rr(0.85, 1.15);
    const g = new THREE.PlaneGeometry(1, 1, 6, 8), p = g.attributes.position, cols = new Float32Array(p.count * 3);
    for (let k = 0; k < p.count; k++) {
      const u = p.getX(k) * 2, v = p.getY(k) + 0.5;
      const wp = Math.pow(Math.sin(Math.PI * Math.pow(v, 0.72)), 0.8);                            // pointed oval
      const rad = len * (0.045 + 0.34 * op * Math.pow(v, 1.25) + 0.05 * Math.sin(Math.PI * v) - (inner ? 0.02 : 0));
      const phi = u * (len * 0.24 * wp) / Math.max(rad, len * 0.10);
      p.setXYZ(k, Math.sin(a0 + phi) * rad, len * v * (1 - 0.22 * op * v), Math.cos(a0 + phi) * rad);

  const line = (key, em, y, rot) => L.hidden.push({ key, em, x: 0, y, rot });

      if (i < parts.length - 1) { L.dots.push({ x: x + gap * em / 2, y: y + 0.26 * em, r: 0.11 * em }); x += gap * em; } });

    const big = ['luxury premium', 'ingredients', 'for good causes', 'by the people,', 'for the people'];
    const em = Math.min(0.115, avail / Math.max(...big.map(gw))), y0 = 0.58;
    big.forEach((k, i) => line(k, em, y0 - i * em * 1.22, (i % 2 ? -1 : 1) * 0.012));

/* ---------- lettering: the call in front of the pane, the name standing in the garden behind it ---------- */
const textScene = new THREE.Scene(), textGroup = new THREE.Group(), markGroup = new THREE.Group(), ctaGroup = new THREE.Group();
textScene.add(textGroup); textGroup.add(markGroup, ctaGroup);
{ const key = new THREE.DirectionalLight(0xfff1dc, 2.6); key.position.set(-2.2, 2.6, 3.2); textScene.add(key);
  const rim = new THREE.DirectionalLight(0xffb040, 1.5); rim.position.set(3, -1.2, 1.5); textScene.add(rim);
  textScene.add(new THREE.HemisphereLight(0xffffff, 0xd9a05a, 1.25)); }

const gold = new THREE.MeshPhysicalMaterial({ color: 0xf0a01c, roughness: 0.32, metalness: 0.55, clearcoat: 0.5 });
const ivoryCta = ivory.clone(), goldCta = gold.clone(); ivoryCta.transparent = goldCta.transparent = true;
const titleScene = new THREE.Scene(), titleGroup = new THREE.Group(); titleScene.add(titleGroup);
{ const key = new THREE.DirectionalLight(0xfff0dc, 2.3); key.position.set(-2.4, 2.4, 3.0); titleScene.add(key);
  const rim = new THREE.DirectionalLight(0xffc070, 1.1); rim.position.set(2.6, -1.0, 1.4); titleScene.add(rim);
  titleScene.add(new THREE.HemisphereLight(0xfffaf0, 0xc89a60, 1.15)); }

let textRT = null, titleRT = null;
/* ---------- render targets ---------- *//* ---------- render targets ---------- */
const slices = Array.from({ length: NS }, (_, i) => ({ d: (SLICES[i] + SLICES[i + 1]) / 2, rt: null, tmp: null, sig: 1,
  near: new THREE.Plane(new THREE.Vector3(0, 0, -1), -SLICES[i]), far: new THREE.Plane(new THREE.Vector3(0, 0, 1), SLICES[i + 1]) }));
let compRT = null, W = 0, H = 0, pxCap = 2.6e6, slow = 0, lastT = 0;

/* ---------- looking around ---------- */
