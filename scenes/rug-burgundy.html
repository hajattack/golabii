<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Golabii — Gold, in bloom</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=DM+Sans:wght@400;500&amp;display=swap"></head><body><div id="golabii-burgundy-velvet">
  <header class="gr-masthead"><span class="gr-brand">Golabii</span><span>THE GOLDEN TIDE</span></header>

    <span class="gr-grip" aria-hidden="true" hidden=""></span>
    <img src="rug-burgundy-poster.png" class="gr-flat" alt="Intricate crimson-and-gold Persian carpet design with a central floral medallion, curling vines, and elaborate borders" hidden="">

  </button>
  <footer class="gr-footer"><span class="gr-hint" aria-live="polite">Lift the silk. Let it bloom.</span><span class="gr-actions"><button class="gr-reveal" type="button">Reveal &amp; pour</button><button class="gr-rotate" type="button">Pause rotation</button><button class="gr-redrape" type="button">Redrape</button></span></footer>
</div>
<style>
#golabii-burgundy-velvet{--gr-velvet:#290910;--gr-paper:#f0dfc3;--gr-gold:#cfb18a;isolation:isolate;position:relative;width:100%;overflow:hidden;background:var(--gr-velvet);color:var(--gr-paper);font-family:'DM Sans',sans-serif;color-scheme:dark}
#golabii-burgundy-velvet *{box-sizing:border-box}
#golabii-burgundy-velvet [hidden]{display:none!important}
#golabii-burgundy-velvet .gr-masthead{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:23px 30px 0;gap:20px}
#golabii-burgundy-velvet .gr-brand{font:500 32px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:-.025em}
#golabii-burgundy-velvet .gr-masthead>span:last-child{font-size:11px;letter-spacing:.16em;color:var(--gr-gold)}
#golabii-burgundy-velvet .gr-title{position:absolute;top:91px;left:30px;z-index:2;pointer-events:none}
#golabii-burgundy-velvet .gr-title>span{font-size:11px;letter-spacing:.16em;color:var(--gr-gold)}
#golabii-burgundy-velvet h2{font:400 48px/.97 'Cormorant Garamond',Georgia,serif;margin:13px 0 0;letter-spacing:-.025em}
#golabii-burgundy-velvet h2 em{font-weight:400}
#golabii-burgundy-velvet .gr-stage{display:block;position:relative;width:100%;height:660px;background:var(--gr-velvet);border:0;border-radius:0;padding:0;margin:0;color:inherit;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent}
#golabii-burgundy-velvet .gr-stage:active{cursor:grabbing}
#golabii-burgundy-velvet .gr-canvas{position:absolute;inset:0;display:block;pointer-events:none}
#golabii-burgundy-velvet .gr-grip{position:absolute;top:0;left:0;width:12px;height:12px;margin:-6px;border:2px solid var(--gr-paper);border-radius:50%;box-shadow:0 0 0 3px #29091055;pointer-events:none}
#golabii-burgundy-velvet canvas{display:block;width:100%;height:100%}
#golabii-burgundy-velvet .gr-flat{position:absolute;width:100%;height:100%;inset:0;object-fit:contain;padding:25px}
#golabii-burgundy-velvet .gr-loading{position:absolute;left:0;right:0;top:52%;font:400 14px/1.5 'DM Sans',sans-serif;color:var(--gr-gold);pointer-events:none}
#golabii-burgundy-velvet .gr-footer{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:0 30px 24px;color:var(--gr-gold);font-size:12px}
#golabii-burgundy-velvet .gr-actions{display:flex;align-items:center;gap:24px;flex-shrink:0}
#golabii-burgundy-velvet .gr-actions button{font:inherit;color:var(--gr-paper);background:transparent;border:0;padding:12px 0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--gr-gold);text-underline-offset:5px;min-height:44px}
@media(max-width:560px){
 #golabii-burgundy-velvet .gr-masthead{padding:19px 21px 0}
 #golabii-burgundy-velvet .gr-brand{font-size:29px}
 #golabii-burgundy-velvet .gr-masthead>span:last-child{font-size:11px;letter-spacing:.10em}
 #golabii-burgundy-velvet .gr-title{top:81px;left:21px}
 #golabii-burgundy-velvet h2{font-size:37px;margin-top:10px}
 #golabii-burgundy-velvet .gr-title>span{font-size:11px;letter-spacing:.10em}
 #golabii-burgundy-velvet .gr-stage{height:600px}
 #golabii-burgundy-velvet .gr-footer{padding:0 21px 23px;gap:15px;flex-wrap:wrap;font-size:12px}
 #golabii-burgundy-velvet .gr-actions{gap:24px}
}
</style>
