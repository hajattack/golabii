<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golabii rose water courtyard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#F3E8D4}
  /* ---- to embed: copy this style block, the section below and the script after it ---- */
  .glb-lab{
    position:relative;width:100%;height:100vh;height:100svh;min-height:560px;max-height:1100px;overflow:hidden;isolation:isolate;
    background:radial-gradient(115% 90% at 55% 42%, #FAF3E6 0%, #F3E8D4 50%, #E7D5B6 100%);
  }
  @media (max-width:760px){.glb-lab{height:128vw;min-height:460px;max-height:100svh}}
  .glb-scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab;outline:none}
  .glb-scene.is-dragging{cursor:grabbing}
  .glb-grain{position:absolute;inset:0;pointer-events:none;opacity:.45;mix-blend-mode:multiply;z-index:3;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .3  0 0 0 0 .2  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
  /* while the 3D loads: a calm warm glow (no steam yet) */
  .glb-veil{position:absolute;inset:0;z-index:2;pointer-events:none}
  .glb-hold{position:absolute;inset:0;background:radial-gradient(115% 90% at 55% 42%, #FAF3E6 0%, #F3E8D4 50%, #E7D5B6 100%);transition:opacity .45s ease}
  .glb-hold::after{content:"";position:absolute;left:32%;top:30%;width:36%;height:40%;border-radius:50%;
    background:radial-gradient(closest-side,rgba(208,128,80,.3),rgba(208,128,80,0));animation:glb-glow 2.8s ease-in-out infinite}
  .glb-veil.is-ready .glb-hold{opacity:0}
  /* the steamed glass: blooms out from the pot when the lid blows, then gets wiped away */
  .glb-fog{position:absolute;inset:0;width:100%;height:100%;opacity:0}
  .glb-cat-prompt{position:absolute;z-index:4;top:clamp(22px,6vh,66px);left:50%;width:min(88%,720px);margin:0;
    transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;color:#674734;
    font:italic 500 clamp(22px,3vw,36px)/1.3 'Fraunces',Georgia,serif;text-wrap:balance;
    text-shadow:0 1px 12px rgba(250,243,230,.95),0 0 26px #FAF3E6}
  .glb-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
  @keyframes glb-glow{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
  @media (prefers-reduced-motion:reduce){.glb-hold::after{animation:none}}
</style>
</head>
<body>
<section class="glb-lab" id="golabii-lab" aria-label="Golabii rose water courtyard">
  <canvas class="glb-scene" role="img" aria-label="A miniature Persian courtyard distillery: rose petals float down a garden channel to a water wheel that lifts them into copper pots, steam cools in a tiled pool, little glass stills make willow, chicory and cardamom waters, saffron is ground and bloomed, and everything is steeped under a glass dome before being bottled. A hoopoe keeps watch on the tall tower. Three white Persian cats explore or sleep, including one on the wall with a front paw dangling over its edge. The courtyard pool and its spout flow with golden yellow water."></canvas>
  <div class="glb-veil" aria-hidden="true">
    <div class="glb-hold"></div>
    <canvas class="glb-fog"></canvas>
  </div>
  <span class="glb-sr-only">Ancient art of distillation.</span>
  <p class="glb-cat-prompt" aria-hidden="true">Can you find all the Persian cats?</p>
  <div class="glb-grain" aria-hidden="true"></div>
</section>
<script>
(() => {
'use strict';
const root = document.getElementById('golabii-lab');
if (!root) return;
const canvas = root.querySelector('.glb-scene');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const catPrompt = root.querySelector('.glb-cat-prompt');
const SMALL = Math.min(innerWidth, (screen && screen.width) || innerWidth) < 760;
const THREE_SRC = root.getAttribute('data-three') || 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';

/* ================================================================== STEAMED GLASS
   Plain 2D canvas: it paints instantly and covers the loading. Later the pot's steam
   fogs it up completely and a whole finger-written title appears at once. During the
   reveal, moving the mouse (or a finger) can wipe the remaining condensation. */
const Veil = (() => {
  const el = root.querySelector('.glb-veil'), fog = el && el.querySelector('.glb-fog');
  if (!fog || !fog.getContext) return { ready() {}, steam(cx, cy, cb) { if (cb) cb(); }, words() {}, enableWipe() {}, coverage: () => 1, hint() {}, autoWipe(cb) { if (cb) cb(); }, clear() {}, fail() {} };
  const g = fog.getContext('2d'), TAU2 = Math.PI * 2, rnd = Math.random;
  const GX = 24, GY = 16, cells = new Uint8Array(GX * GY);
  let W = 2, H = 2, D = 1, alive = true, raf = 0, wipeOn = false, last = null, onFirst = null, covered = 0, lastT = 0;
  const drips = [];
  // Rounded, uneven finger strokes cut through the condensation; no font request or drawing animation.
  const cleanFog = document.createElement('canvas'), wordMask = document.createElement('canvas'), wordRim = document.createElement('canvas');
  const cleanG = cleanFog.getContext('2d'), maskG = wordMask.getContext('2d'), rimG = wordRim.getContext('2d');
  let wordOpacity = 0;
  const letters = {
    a: [29, 'M24 27 C19 18 5 23 5 38 C4 54 20 55 24 39 M24 24 C22 36 22 48 27 51'],
    n: [29, 'M5 24 L4 51 M5 34 C12 18 26 19 25 36 L24 51'],
    c: [27, 'M24 27 C13 17 3 27 4 40 C5 53 17 55 25 47'],
    i: [13, 'M7 25 L6 51 M8 12 L8 13'],
    e: [28, 'M5 37 C13 39 26 32 23 26 C16 16 3 27 4 40 C6 54 20 55 26 47'],
    t: [21, 'M12 8 C10 24 7 42 11 49 C13 53 18 51 20 48 M3 25 L21 24'],
    r: [22, 'M5 25 L4 51 M5 36 C9 25 15 20 22 25'],
    o: [29, 'M17 23 C3 20 1 41 8 49 C20 58 30 43 24 28 C22 24 19 23 17 23'],
    f: [23, 'M5 64 C8 48 8 28 12 13 C16 1 26 4 23 12 M3 27 L22 26'],
    d: [30, 'M24 29 C18 19 4 24 4 40 C5 55 20 54 24 40 M26 4 C24 19 22 42 27 51'],
    s: [26, 'M23 27 C13 16 0 27 10 34 L19 39 C30 49 13 59 4 48'],
    l: [15, 'M8 5 C6 21 5 41 8 48 C10 52 12 51 14 49'],
    ' ': [16, '']
  };
  const lineWidth = text => [...text].reduce((sum, ch) => sum + letters[ch][0] + 4, -4);
  function stampWords(ctx, strokeWidth, color) {
    const scale = Math.min(W * .8 / lineWidth('ancient art of'), H * .24 / 140, 2.1 * D);
    const lines = [['ancient art of', 1, -.5], ['distillation', 1.12, 73]];
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = color;
    lines.forEach(([text, factor, offset]) => {
      const s = scale * factor;
      let x = (W - lineWidth(text) * s) / 2;
      [...text].forEach((ch, i) => {
        const [advance, path] = letters[ch];
        if (path) {
          ctx.save(); ctx.translate(x, H * .39 + offset * scale + Math.sin(i * 2.7) * scale * 1.3);
          ctx.scale(s, s); ctx.rotate(Math.sin(i * 1.9) * .025); ctx.lineWidth = strokeWidth;
          ctx.stroke(new Path2D(path)); ctx.restore();
        }
        x += (advance + 4) * s;
      });
    });
  }
  function prepareWords() {
    [cleanFog, wordMask, wordRim].forEach(c => { c.width = W; c.height = H; });
    cleanG.drawImage(fog, 0, 0);
    stampWords(maskG, 5.7, '#000');
    // A fine wet edge catches the light around each cleared finger mark.
    stampWords(rimG, 8.3, 'rgba(255,255,255,.42)');
    stampWords(rimG, 6.8, 'rgba(110,82,57,.23)');
    rimG.globalCompositeOperation = 'destination-out'; stampWords(rimG, 5.7, '#000');
    rimG.globalCompositeOperation = 'source-over';
  }
  function words(opacity) {
    wordOpacity = Math.max(0, Math.min(1, opacity));
    g.save(); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    g.clearRect(0, 0, W, H); g.drawImage(cleanFog, 0, 0);
    if (wordOpacity > 0) {
      g.globalCompositeOperation = 'destination-out'; g.globalAlpha = wordOpacity * .94; g.drawImage(wordMask, 0, 0);
      g.globalCompositeOperation = 'source-over'; g.globalAlpha = wordOpacity; g.drawImage(wordRim, 0, 0);
    }
    g.restore();
  }
  function dot(x, y, r) {
    g.globalCompositeOperation = 'destination-out';
    g.fillStyle = 'rgba(0,0,0,.2)'; g.beginPath(); g.arc(x, y, r, 0, TAU2); g.fill();
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.arc(x - r * .32, y - r * .34, r * .36, 0, TAU2); g.fill();
    if (r > 1.7 * D) { g.strokeStyle = 'rgba(120,92,70,.2)'; g.lineWidth = Math.max(.7, r * .2); g.beginPath(); g.arc(x, y, r * .86, .25, 2.7); g.stroke(); }
  }
  function paint() {
    const r = root.getBoundingClientRect();
    D = Math.min(1.5, window.devicePixelRatio || 1);
    W = Math.max(2, Math.round(r.width * D)); H = Math.max(2, Math.round(r.height * D));
    fog.width = W; fog.height = H;
    g.globalCompositeOperation = 'source-over';
    const base = g.createLinearGradient(0, 0, W * .35, H);
    base.addColorStop(0, 'rgba(253,249,243,.94)'); base.addColorStop(1, 'rgba(242,232,218,.97)');
    g.fillStyle = base; g.fillRect(0, 0, W, H);
    const M2 = Math.max(W, H);
    for (let i = 0; i < 44; i++) {
      const x = rnd() * W, y = rnd() * H, rr = M2 * (.07 + rnd() * .26), a = .04 + rnd() * .1;
      const gr = g.createRadialGradient(x, y, 0, x, y, rr);
      gr.addColorStop(0, rnd() < .6 ? `rgba(255,255,255,${a})` : `rgba(226,208,186,${a})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
    }
    const n = Math.min(6500, (W * H) / (200 * D * D));
    for (let i = 0; i < n; i++) dot(rnd() * W, rnd() * H, (rnd() < .93 ? .5 + rnd() * 1.3 : 1.8 + rnd() * 3.4) * D);
    prepareWords(); words(wordOpacity);
  }
  function seg(x0, y0, x1, y1) { g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
  function wipe(x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
    if (L < .75) return false;
    const w = Math.min(W, H) * (SMALL ? .17 : .12), nx = -dy / L, ny = dx / L;
    g.save(); g.globalCompositeOperation = 'destination-out'; g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = 'rgba(0,0,0,.3)'; g.lineWidth = w * 1.4; seg(x0, y0, x1, y1);
    g.strokeStyle = 'rgba(0,0,0,.68)'; g.lineWidth = w; seg(x0, y0, x1, y1);
    g.strokeStyle = 'rgba(0,0,0,1)'; g.lineWidth = w * .16;                 // finger lines: the fog left between them reads as streaks
    for (let k = 0; k < 4; k++) { const o = (k - 1.5) * w * .24; seg(x0 + nx * o, y0 + ny * o, x1 + nx * o, y1 + ny * o); }
    g.restore();
    for (let s = 0; s < L; s += 12 * D) {                                  // water beads up along the edges, some of it runs
      const t = s / L, side = rnd() < .5 ? 1 : -1, px = x0 + dx * t, py = y0 + dy * t;
      if (rnd() < .55) dot(px + nx * side * w * .7, py + ny * side * w * .7, (.9 + rnd() * 2.4) * D);
      if (rnd() < .06 && drips.length < 28) drips.push({ x: px + (rnd() - .5) * w * .8, y: py + w * .42, r: (1.7 + rnd() * 1.7) * D, v: (20 + rnd() * 42) * D, life: 1.2 + rnd() * 2.4, t: 0, ph: rnd() * 6 });
    }
    const cw = W / GX, ch = H / GY, rx = Math.ceil(w * .5 / cw), ry = Math.ceil(w * .5 / ch);
    for (let s = 0; s <= L; s += w * .5) {
      const cx = Math.floor((x0 + dx * s / L) / cw), cy = Math.floor((y0 + dy * s / L) / ch);
      for (let j = cy - ry; j <= cy + ry; j++) for (let i = cx - rx; i <= cx + rx; i++) if (i >= 0 && j >= 0 && i < GX && j < GY && !cells[j * GX + i]) { cells[j * GX + i] = 1; covered++; }
    }
    return true;
  }
  function stepDrips(dt) {
    for (let i = drips.length - 1; i >= 0; i--) {
      const d = drips[i]; d.t += dt;
      if (d.t > d.life || d.y > H + 10) { drips.splice(i, 1); continue; }
      const go = Math.sin(d.t * 4.5 + d.ph) > -.3 ? 1 : .06;
      const nx = d.x + Math.sin(d.t * 2.2 + d.ph) * .3 * D, ny = d.y + d.v * dt * go;
      g.save(); g.globalCompositeOperation = 'destination-out'; g.lineCap = 'round'; g.strokeStyle = 'rgba(0,0,0,.95)'; g.lineWidth = d.r * 2.1; seg(d.x, d.y, nx, ny); g.restore();
      g.globalCompositeOperation = 'source-over';
      g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(nx - d.r * .28, ny - d.r * .1, d.r * .42, 0, TAU2); g.fill();
      g.strokeStyle = 'rgba(110,86,66,.24)'; g.lineWidth = Math.max(.7, d.r * .3); g.beginPath(); g.arc(nx, ny, d.r * .85, .3, 2.8); g.stroke();
      d.x = nx; d.y = ny;
    }
  }
  function loop(now) {
    if (!alive) return;
    raf = requestAnimationFrame(loop);
    const dt = lastT ? Math.min(.05, (now - lastT) / 1000) : 0; lastT = now;
    if (drips.length) stepDrips(dt);
  }
  function local(cx, cy) { const r = root.getBoundingClientRect(); return [(cx - r.left) * W / Math.max(1, r.width), (cy - r.top) * H / Math.max(1, r.height)]; }
  function move(cx, cy) {
    if (!wipeOn) { last = null; return; }
    const p = local(cx, cy);
    if (last && wipe(last[0], last[1], p[0], p[1]) && onFirst) { const f = onFirst; onFirst = null; f(); }
    last = p;
  }
  root.addEventListener('pointermove', e => { if (e.pointerType !== 'touch') move(e.clientX, e.clientY); });
  root.addEventListener('pointerleave', () => { last = null; });
  root.addEventListener('touchstart', e => { last = null; const t = e.touches[0]; if (t) move(t.clientX, t.clientY); }, { passive: true });
  root.addEventListener('touchmove', e => { const t = e.touches[0]; if (t) move(t.clientX, t.clientY); }, { passive: true });
  root.addEventListener('touchend', () => { last = null; }, { passive: true });
  paint();
  raf = requestAnimationFrame(loop);
  if (window.ResizeObserver) {
    let pw = 0, ph = 0;
    new ResizeObserver(() => { if (!alive || covered) return; const r = root.getBoundingClientRect(); if (Math.abs(r.width - pw) > 2 || Math.abs(r.height - ph) > 2) { pw = r.width; ph = r.height; paint(); } }).observe(root);
  }
  function swipe(pts, dur, cb) {                                           // an invisible finger drawing through the fog
    let k = 1; const t0 = performance.now(), n = pts.length - 1;
    const step = now => {
      if (!alive) return;
      const u = Math.min(1, Math.max(0, now - t0) / dur), e = 1 - (1 - u) * (1 - u), to = Math.max(1, Math.floor(e * n));
      while (k <= to) { wipe(pts[k - 1][0], pts[k - 1][1], pts[k][0], pts[k][1]); k++; }
      if (u < 1) requestAnimationFrame(step); else if (cb) cb();
    };
    requestAnimationFrame(step);
  }
  return {
    ready() { el.classList.add('is-ready'); },                                   // the scene is drawing: the placeholder melts away
    words,
    steam(cx, cy, cb) {                                                              // the burst hits the glass: condensation spreads out from the pot
      const r = root.getBoundingClientRect(), R1 = Math.hypot(Math.max(cx, r.width - cx), Math.max(cy, r.height - cy)) + 40, t0 = performance.now(), dur = 450;
      fog.style.opacity = '1';
      if (reduceMotion) { fog.style.webkitMaskImage = 'none'; fog.style.maskImage = 'none'; if (cb) cb(); return; }
      const step = now => {
        if (!alive) return;
        const u = Math.min(1, Math.max(0, now - t0) / dur), e = 1 - Math.pow(1 - u, 3), rad = 30 + (R1 - 30) * e, fe = 50 + 140 * (1 - e);
        const m = `radial-gradient(circle at ${cx}px ${cy}px, #000 ${rad.toFixed(1)}px, rgba(0,0,0,0) ${(rad + fe).toFixed(1)}px)`;
        fog.style.webkitMaskImage = m; fog.style.maskImage = m;
        if (u < 1) requestAnimationFrame(step); else { fog.style.webkitMaskImage = 'none'; fog.style.maskImage = 'none'; if (cb) cb(); }
      };
      requestAnimationFrame(step);
    },
    enableWipe(cb) { wipeOn = true; onFirst = cb; },
    coverage: () => covered / (GX * GY),
    hint() {                                                                     // a short ghost stroke that shows what to do
      const pts = [], y0 = H * (SMALL ? .55 : .6);
      for (let i = 0; i <= 14; i++) { const u = i / 14; pts.push([W * (.38 + .24 * u), y0 - Math.sin(u * Math.PI) * H * .04]); }
      swipe(pts, 650);
    },
    autoWipe(cb) {                                                               // nobody moved for a while: wipe it for them
      const pts = [], y0 = H * (SMALL ? .5 : .57);
      for (let i = 0; i <= 44; i++) { const u = i / 44; pts.push([W * (.1 + .8 * u), y0 + Math.sin(u * 3.6 + .4) * H * .08 - u * H * .06]); }
      swipe(pts, 950, cb);
    },
    clear(ms = 1900, allowWipe = false) {
      wipeOn = allowWipe; onFirst = null;
      el.style.transition = `opacity ${ms}ms cubic-bezier(.4,0,.2,1)`; el.style.opacity = '0';
      setTimeout(() => { alive = false; wipeOn = false; cancelAnimationFrame(raf); el.remove(); }, ms + 60);
    },
    fail() { this.clear(900); },
  };
})();

/* ================================================================== LOAD LAZILY: nothing heavy happens until the courtyard is near the viewport */
function loadThree() {
  if (window.THREE) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = THREE_SRC; s.async = true;
    s.onload = () => (window.THREE ? res() : rej(new Error('three.js did not load')));
    s.onerror = () => rej(new Error('three.js failed to load'));
    document.head.appendChild(s);
  });
}
let started = false;
function start() {
  if (started) return; started = true;
  loadThree().then(build).catch(err => { console.warn('[golabii-lab]', err); Veil.fail(); });
}
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); start(); } }, { rootMargin: '600px 0px' });
  io.observe(root);
} else start();

/* ================================================================== THE 3D COURTYARD (built in small slices behind the fog) */
async function build() {
// yield a real frame between slices so the fog keeps painting (with a timeout fallback for background tabs)
const tick = () => new Promise(r => { let done = false; const go = () => { if (!done) { done = true; setTimeout(r, 0); } }; requestAnimationFrame(go); setTimeout(go, 120); });

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, innerWidth < 760 ? 1.6 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .98;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const S = new THREE.Group(); scene.add(S);          // static things; merged by material at the end
const updaters = [];

/* ------------------------------------------------------------------ utils */
const TAU = Math.PI * 2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand = mulberry32(4401);
const R = (a, b) => a + (b - a) * rand();
const pick = arr => arr[(rand() * arr.length) | 0];
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const lin = h => new THREE.Color(h).convertSRGBToLinear();
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const Y = V(0, 1, 0), Z = V(0, 0, 1);
const TY = .94; // terrace floor height

function canvasTex(w, h, draw, repeat, linear) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (!linear) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat[0], repeat[1]);
  t.userData = t.userData || {};
  t.userData.redraw = () => { g.clearRect(0, 0, w, h); draw(g, w, h); t.needsUpdate = true; };
  return t;
}
function speckle(g, w, h, n, dark, light, a0 = .03, a1 = .09) {
  for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${rand() < .5 ? dark : light},${R(a0, a1)})`; g.fillRect(R(0, w), R(0, h), R(1, 3), R(1, 3)); }
}

/* ------------------------------------------------------------------ textures */
// octagon-and-square floor (Persian courtyard paving)
function octTex(grout, hA, hB, ins, cells = 4) {
  return canvasTex(512, 512, (g) => {
    const s = 512 / cells, c = s * .29;

const rainP = Array.from({ length: RAIN_N }, () => ({ x: R(-11, 11), z: R(-8.5, 8.5), y0: R(0, 1), sp: R(.3, .55), sw: R(.2, .5), ph: R(0, TAU), spin: V(R(-2, 2), R(-2, 2), R(-2, 2)), s: R(.75, 1.15) }));
const RAIN_TOP = 12;
updaters.push(t => {
  for (let i = 0; i < RAIN_N; i++) {
    const r = rainP[i];
    const onDeck = Math.abs(r.x) < 8 && Math.abs(r.z) < 6;
    const floor = !onDeck ? -.34 : (r.z < -1.6 ? TY + .03 : .034);   // lands above the carpets, never inside them
    const span = RAIN_TOP - floor + 1.2, travel = (t * r.sp + r.y0 * span) % span;
    let y = RAIN_TOP - travel, sc = r.s;
    if (y < floor) { sc *= 1 - (floor - y) / 1.2; y = floor; }
    _p.set(r.x + Math.sin(t * .6 + r.ph) * r.sw + t * .05 % 1, y, r.z + Math.cos(t * .5 + r.ph) * r.sw);
    const land = y <= floor + .001;
    setInst(rain, i, _p, land ? 0 : r.spin.x * t, r.ph + (land ? 0 : r.spin.y * t), land ? 0 : r.spin.z * t, Math.max(0, sc));
  }
  rain.instanceMatrix.needsUpdate = true;
});

/* ================================================================== OPENING
   The moment the courtyard is on screen: the nearest deeg rattles, blows its lid, a wall of steam hits the glass
   and condensation spreads out from the pot. The complete finger-written phrase appears at once,
   fades back into the fog, then the camera pulls back and the cat-finding invitation appears. */
const INTRO = { on: true, animated: !reduceMotion, phase: 'wait', t: 0, burstAt: -1, titleAt: -1, clearT: -1, fogged: false, wordAlpha: -1 };
let inView = false;
if ('IntersectionObserver' in window) new IntersectionObserver(es => { inView = es[0].intersectionRatio >= .35; }, { threshold: [0, .35, .7, 1] }).observe(root); else inView = true;
const BURST = [];
if (INTRO.animated) for (let i = 0; i < (SMALL ? 36 : 50); i++) {
  const s = new THREE.Sprite(spriteMat('#FFF9F2', 0)); s.visible = false; s.renderOrder = 7; scene.add(s);
  const ring = i < 16, a = R(0, TAU);
  BURST.push({ s, b: ring ? R(0, .15) : R(.04, .7), s0: ring ? R(.22, .36) : R(.35, .65), gr: ring ? R(1.1, 1.8) : R(1.8, 3.4), pk: R(.6, .9), ph: R(0, TAU),
    o: ring ? V(POT_A.x + Math.cos(a) * .63, RIM_Y + .03, POT_A.z + Math.sin(a) * .63) : V(POT_A.x + R(-.15, .15), RIM_Y + .25, POT_A.z + R(-.15, .15)),
    v: ring ? V(Math.cos(a) * R(.5, .9), R(.3, .75), Math.sin(a) * R(.5, .9)) : V(R(-.25, .25) + .45, R(1.2, 2.4), R(-.25, .25) + .45) });
}
const _ps2 = V(0, 0, 0);
function potOnScreen() { _ps2.set(POT_A.x, RIM_Y + .35, POT_A.z).project(cam); return [(_ps2.x + 1) / 2 * size.w, (1 - _ps2.y) / 2 * size.h]; }
updaters.push((t, dt) => {
  const IN = INTRO;
  let lift = 0, tx = 0, tz = 0;   // pot A's lid
  if (IN.animated && IN.on && IN.phase !== 'wait') {
    const it = IN.t;
    if (IN.burstAt < 0) { const k = smooth(0, .4, it); lift = .014 * k * (1 + Math.sin(it * 41)); tx = .035 * k * Math.sin(it * 33); tz = .035 * k * Math.cos(it * 29); }
    else if (IN.clearT < 0) { const bt = it - IN.burstAt; lift = .13 * (1 - Math.exp(-bt * 9)) + .06 * Math.exp(-bt * 3) * Math.sin(bt * 18); tx = .08 * Math.exp(-bt * 1.5) * Math.sin(bt * 21) + .01 * Math.sin(it * 5); tz = .03 + .07 * Math.exp(-bt * 1.4) * Math.cos(bt * 17); }
    else { const ct = it - IN.clearT, u = easeInOut(clamp(ct / .8, 0, 1)); lift = .13 * (1 - u) + (ct > .8 ? .012 * Math.exp(-(ct - .8) * 8) * Math.abs(Math.sin((ct - .8) * 25)) : 0); tx = .01 * (1 - u); tz = .03 * (1 - u); }
  } else if (!reduceMotion) { const cc = t % 12; if (cc < .7) { const k = Math.sin(Math.PI * cc / .7); lift = .012 * k * (1 + Math.sin(t * 40)); tx = .02 * k * Math.sin(t * 31); tz = .02 * k * Math.cos(t * 27); } }
  LID_A.position.y = RIM_Y + lift; LID_A.rotation.set(tx, 0, tz);
  if (!IN.on) return;
  const showTitle = () => { IN.phase = 'title'; IN.titleAt = IN.t; IN.wordAlpha = 1; Veil.words(1); };
  if (IN.phase === 'wait') {
    if (!inView) return;
    IN.phase = 'open'; IN.t = 0; Veil.ready();
    if (!IN.animated) { IN.fogged = true; Veil.steam(size.w / 2, size.h / 2, showTitle); }
    return;
  }
  IN.t += dt;
  const it = IN.t;
  if (IN.animated && IN.burstAt < 0 && it > .5) IN.burstAt = it;
  if (!IN.fogged && IN.burstAt >= 0 && it - IN.burstAt > .32) {
    IN.fogged = true; const p = potOnScreen(); Veil.steam(p[0], p[1], showTitle);
  }
  if (IN.phase === 'title') {
    const age = it - IN.titleAt, alpha = 1 - smooth(2.45, 3.1, age);
    if (alpha !== IN.wordAlpha) { Veil.words(alpha); IN.wordAlpha = alpha; }
    if (age >= 3.1) {
      IN.phase = 'clear'; IN.clearT = it; Veil.clear(reduceMotion ? 650 : 1500, !reduceMotion);
      if (IN.animated) { CAMM.mode = 'pull'; CAMM.t = 0; }
    }
  }
  if (IN.phase === 'clear') {
    const age = it - IN.clearT, start = reduceMotion ? .7 : 2.5;
    const opacity = smooth(start, start + .4, age) * (1 - smooth(start + 2.4, start + 3.2, age));
    catPrompt.style.opacity = opacity.toFixed(3);
    catPrompt.setAttribute('aria-hidden', opacity > .01 ? 'false' : 'true');
    if (age > start + 3.25) {
      IN.on = false; IN.phase = 'done'; catPrompt.style.opacity = '0'; catPrompt.setAttribute('aria-hidden', 'true');
      BURST.forEach(b => { b.s.visible = false; }); return;
    }
  }
  if (IN.burstAt >= 0) BURST.forEach(b => {
    const age = it - IN.burstAt - b.b;
    if (age < 0) { b.s.visible = false; return; }
    const damp = 1 / (1 + .35 * age);
    b.s.position.set(b.o.x + b.v.x * age * damp + Math.sin(age * 1.3 + b.ph) * .12 * age, b.o.y + b.v.y * age * damp, b.o.z + b.v.z * age * damp + Math.cos(age * 1.1 + b.ph) * .12 * age);
    const sc = b.s0 + b.gr * age / (1 + .15 * age); b.s.scale.set(sc, sc, 1);
    b.s.material.opacity = b.pk * smooth(0, .2, age) * (1 - smooth(1.3, 2.9, age));
    b.s.visible = b.s.material.opacity > .003;
  });
});
updaters.push(() => { PN.flush(); PA.flush(); });   // last: upload all particle positions in one go

/* ================================================================== MERGE STATIC GEOMETRY BY MATERIAL */
(function mergeStatic() {
  S.updateMatrixWorld(true);
  const buckets = new Map(), keep = [], MERGE_GLASS = new Set([GLASS, GLASS_TUBE]);
  S.traverse(o => {
    if (!o.isMesh || o.isInstancedMesh) return;
    if (Array.isArray(o.material) || o.material.alphaTest > 0 || (o.material.transparent && !MERGE_GLASS.has(o.material))) { keep.push(o); return; }
    const key = o.material.uuid + '|' + o.castShadow + '|' + o.receiveShadow + '|' + o.renderOrder;
    if (!buckets.has(key)) buckets.set(key, { mat: o.material, cast: o.castShadow, recv: o.receiveShadow, order: o.renderOrder, geos: [] });
    const g = (o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone());
    g.applyMatrix4(o.matrixWorld);
    buckets.get(key).geos.push(g);
  });
  const out = new THREE.Group();
  buckets.forEach(b => { const m = new THREE.Mesh(merge(b.geos, !!b.mat.vertexColors), b.mat); m.castShadow = b.cast; m.receiveShadow = b.recv; m.renderOrder = b.order; out.add(m); });
  keep.forEach(o => { const w = o.matrixWorld.clone(); o.parent.remove(o); w.decompose(o.position, o.quaternion, o.scale); out.add(o); });
  scene.remove(S); scene.add(out);
})();
await tick();

/* ================================================================== CAMERA
   Opening close-up and pull-back; after that the camera never moves by itself.
   Drag to turn, scroll or pinch to zoom (towards the cursor), right-drag / shift-drag / two fingers to pan,
   double-click to zoom in (or back home when already close). */
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 200);
const HOME = { f: V(0, 1.65, -.35), az: .075, el: .56 };   // centered, almost straight-on, with a little height to see inside
const INTRO_F = V(-4.45, 2.45, -4.35);
const CAMM = { mode: INTRO.animated ? 'intro' : 'free', t: 0 };
const size = { w: 1, h: 1 };
const _dir = V(0, 0, 0), _dbs = new THREE.Vector2(), _right = V(0, 0, 0), _up = V(0, 0, 0);
const viewVS = () => Math.max(15.8, 20.5 / (size.w / size.h));
const homeZ = () => size.w < 760 ? 1.1 : 1.0;
const introZ = () => 3.3 * viewVS() / 17;
const ZMIN = () => homeZ() * .8, ZMAX = () => homeZ() * 7;
const view = { f: (INTRO.animated ? INTRO_F : HOME.f).clone(), az: HOME.az, el: HOME.el, z: INTRO.animated ? 3.3 : 1 };   // what is on screen
const goal = { f: HOME.f.clone(), az: HOME.az, el: HOME.el, z: 1 };                                         // where the visitor is steering
let goalSet = !INTRO.animated;
function clampGoal() { goal.z = clamp(goal.z, ZMIN(), ZMAX()); goal.el = clamp(goal.el, .18, 1.32); goal.f.x = clamp(goal.f.x, -8.5, 8.5); goal.f.z = clamp(goal.f.z, -6.5, 6.5); goal.f.y = clamp(goal.f.y, -.3, 4); }
function homeGoal() { goal.f.copy(HOME.f); goal.az = HOME.az; goal.el = HOME.el; goal.z = homeZ(); }
function takeOver() { if (CAMM.mode === 'pull') { CAMM.mode = 'free'; goal.f.copy(view.f); goal.az = view.az; goal.el = view.el; goal.z = view.z; goalSet = true; } }
function updateCamera(t, dt) {
  const a = size.w / size.h, vs = viewVS();
  if (CAMM.mode === 'intro') {
    CAMM.t += dt; view.f.copy(INTRO_F); view.z = introZ() * (1 + .04 * smooth(0, 6, CAMM.t)); view.az = HOME.az; view.el = HOME.el;
  } else if (CAMM.mode === 'pull') {
    CAMM.t += dt; const u = easeInOut(clamp(CAMM.t / 3.4, 0, 1));
    view.f.lerpVectors(INTRO_F, HOME.f, u); view.z = Math.exp(Math.log(introZ() * 1.04) * (1 - u) + Math.log(homeZ()) * u); view.az = HOME.az; view.el = HOME.el;
    if (u >= 1) { CAMM.mode = 'free'; homeGoal(); goalSet = true; }
  } else {
    if (!goalSet) { homeGoal(); goalSet = true; }
    const k = reduceMotion ? 1 : 1 - Math.exp(-dt * 10);
    view.f.lerp(goal.f, k); view.az += (goal.az - view.az) * k; view.el += (goal.el - view.el) * k;
    view.z = Math.exp(Math.log(view.z) + (Math.log(goal.z) - Math.log(view.z)) * k);
  }
  cam.left = -vs * a / 2; cam.right = vs * a / 2; cam.top = vs / 2; cam.bottom = -vs / 2; cam.zoom = view.z; cam.updateProjectionMatrix();
  const ps = renderer.getDrawingBufferSize(_dbs).y * cam.zoom / vs; PN.mat.uniforms.pscale.value = ps; PA.mat.uniforms.pscale.value = ps;
  _dir.set(Math.sin(view.az) * Math.cos(view.el), Math.sin(view.el), Math.cos(view.az) * Math.cos(view.el));
  cam.position.copy(view.f).addScaledVector(_dir, 60); cam.lookAt(view.f);
}
function screenBasis() { cam.updateMatrixWorld(); _right.setFromMatrixColumn(cam.matrixWorld, 0); _up.setFromMatrixColumn(cam.matrixWorld, 1); }
function panBy(dx, dy) { const upp = viewVS() / (goal.z * size.h); screenBasis(); goal.f.addScaledVector(_right, -dx * upp).addScaledVector(_up, dy * upp); clampGoal(); }
function zoomAt(cx, cy, s) {   // keeps the point under the cursor where it is
  const r = canvas.getBoundingClientRect(), dx = cx - (r.left + r.width / 2), dy = cy - (r.top + r.height / 2);
  const z0 = goal.z, z1 = clamp(z0 * s, ZMIN(), ZMAX()), k = 1 - z0 / z1, upp = viewVS() / (z0 * size.h);
  screenBasis(); goal.f.addScaledVector(_right, dx * upp * k).addScaledVector(_up, -dy * upp * k); goal.z = z1; clampGoal();
}

/* ================================================================== INPUT, SIZE, VISIBILITY, LOOP */
// the plain mouse wheel only zooms once you've grabbed the courtyard (so the page still scrolls past it); pinch always zooms
let engaged = false, drag = null, pinch = null;
const pointers = new Map();
const pinchNow = () => { const [a, b] = [...pointers.values()]; return { d: Math.max(10, Math.hypot(a.x - b.x, a.y - b.y)), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
canvas.addEventListener('pointerdown', e => {
  if (CAMM.mode === 'intro') return;
  engaged = true; takeOver();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, pan: e.button === 1 || e.button === 2 || e.shiftKey, type: e.pointerType };
  else if (pointers.size === 2) { drag = null; pinch = pinchNow(); }
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (pinch && pointers.size >= 2) { const n = pinchNow(); zoomAt(n.x, n.y, n.d / pinch.d); panBy(n.x - pinch.x, n.y - pinch.y); pinch = n; return; }
  if (!drag) return;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) canvas.classList.add('is-dragging');
  if (drag.pan) panBy(dx, dy);
  else { goal.az -= dx * .006; if (drag.type !== 'touch') goal.el += dy * .004; clampGoal(); }
});
const release = e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 1) { const p = pointers.values().next().value; drag = { x: p.x, y: p.y, pan: false, type: 'touch' }; }
  if (!pointers.size) { drag = null; canvas.classList.remove('is-dragging'); }
};
canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  if (CAMM.mode === 'intro' || (!e.ctrlKey && !e.metaKey && !engaged)) return;
  e.preventDefault(); takeOver();
  const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomAt(e.clientX, e.clientY, Math.exp(-d * (e.ctrlKey ? .01 : .0018)));
}, { passive: false });
canvas.addEventListener('dblclick', e => { if (CAMM.mode === 'intro') return; takeOver(); if (goal.z > ZMAX() * .55) homeGoal(); else zoomAt(e.clientX, e.clientY, 1.9); });
root.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') engaged = false; });

function resize() { const r = root.getBoundingClientRect(); size.w = Math.max(1, r.width); size.h = Math.max(1, r.height); renderer.setSize(size.w, size.h, false); }
resize();
if (window.ResizeObserver) new ResizeObserver(resize).observe(root); else addEventListener('resize', resize);
let visible = true;
if (window.IntersectionObserver) new IntersectionObserver(es => { visible = es[0].isIntersecting; }, { threshold: .02 }).observe(root);
if (document.fonts && document.fonts.load) document.fonts.load('italic 500 118px Fraunces').then(() => labelTex.userData.redraw()).catch(() => {});

let T = 0, last = performance.now(), frameN = 0;
renderer.shadowMap.autoUpdate = false; renderer.shadowMap.needsUpdate = true;
// adaptive sharpness: if frames keep running long, render a few fewer pixels; give them back when there is headroom
const DPR_MAX = Math.min(window.devicePixelRatio || 1, SMALL ? 1.6 : 2), DPR_MIN = Math.min(DPR_MAX, SMALL ? .85 : 1);
let dpr = renderer.getPixelRatio(), ema = 16, slowT = 0, fastT = 0;
function adapt(raw) {
  if (raw <= 0 || raw > .25) return;
  ema += (raw * 1000 - ema) * .05;
  if (ema > 21) { slowT += raw; fastT = 0; } else if (ema < 13) { fastT += raw; slowT = 0; } else { slowT = 0; fastT = 0; }
  if (slowT > 1.2 && dpr > DPR_MIN + .01) { dpr = Math.max(DPR_MIN, dpr * .85); renderer.setPixelRatio(dpr); resize(); slowT = 0; ema = 16; }
  else if (fastT > 4 && dpr < DPR_MAX - .01) { dpr = Math.min(DPR_MAX, dpr * 1.12); renderer.setPixelRatio(dpr); resize(); fastT = 0; }
}
function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000, dt = clamp(raw, 0, .05); last = now;
  if (!visible || document.hidden) return;
  T += dt;
  adapt(raw);
  for (let i = 0; i < updaters.length; i++) updaters[i](T, dt);
  updateCamera(T, dt);
  if (frameN++ % (SMALL ? 3 : 2) === 0) renderer.shadowMap.needsUpdate = true;   // moving shadows are slow; half-rate is invisible
  renderer.render(scene, cam);
}
// compile every shader while the glass is still fogged, so the first visible frame doesn't hitch
view.z = INTRO.animated ? introZ() : homeZ();
if (!INTRO.animated) homeGoal();
updateCamera(0, 0);
try { renderer.compile(scene, cam); } catch (e) { /* falls back to compiling on the first frame */ }
await tick();
last = performance.now();
requestAnimationFrame(frame);
window.golabiiLab = { resetView: () => { if (CAMM.mode === 'free') homeGoal(); } };
}
})();
</script>
</body>
